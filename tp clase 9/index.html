<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción Diario - Terra Green</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-principal">
        
        <header class="cabecera-verde">
            <div class="boton-newsletter">SUSCRIPCIÓN A TERRA GREEN</div>
        </header>

        <div class="fondo-beige-claro">
            <div class="tarjeta-formulario">
                <h2 class="titulo-formulario">FORMULARIO DE LECTORES</h2>
                
                <form id="suscripcionForm" novalidate>
                    <div class="form-grid">
                        
                        <div class="field-group">
                            <label for="nombre">Nombre Completo</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez">
                            <div class="error-message" id="error-nombre"></div>
                        </div>

                        <div class="field-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                            <div class="error-message" id="error-email"></div>
                        </div>

                        <div class="field-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" placeholder="Al menos 8 caracteres">
                            <div class="error-message" id="error-password"></div>
                        </div>

                        <div class="field-group">
                            <label for="password_rep">Repetir Contraseña</label>
                            <input type="password" id="password_rep" name="password_rep" placeholder="Repite tu contraseña">
                            <div class="error-message" id="error-password_rep"></div>
                        </div>

                        <div class="field-group">
                            <label for="edad">Edad</label>
                            <input type="number" id="edad" name="edad" placeholder="Mayor o igual a 18">
                            <div class="error-message" id="error-edad"></div>
                        </div>

                        <div class="field-group">
                            <label for="telefono">Teléfono</label>
                            <input type="text" id="telefono" name="telefono" placeholder="Mínimo 7 dígitos">
                            <div class="error-message" id="error-telefono"></div>
                        </div>

                        <div class="field-group">
                            <label for="direccion">Dirección</label>
                            <input type="text" id="direccion" name="direccion" placeholder="Ej. Calle Falsa 123">
                            <div class="error-message" id="error-direccion"></div>
                        </div>

                        <div class="field-group">
                            <label for="ciudad">Ciudad</label>
                            <input type="text" id="ciudad" name="ciudad" placeholder="Ej. Rosario">
                            <div class="error-message" id="error-ciudad"></div>
                        </div>

                        <div class="field-group">
                            <label for="cp">Código Postal</label>
                            <input type="text" id="cp" name="cp" placeholder="Ej. 2000">
                            <div class="error-message" id="error-cp"></div>
                        </div>

                        <div class="field-group">
                            <label for="dni">DNI</label>
                            <input type="text" id="dni" name="dni" placeholder="7 u 8 dígitos">
                            <div class="error-message" id="error-dni"></div>
                        </div>

                        <div class="submit-container">
                            <button type="submit" class="submit-btn">ENVIAR</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <footer class="pie-pagina">
            <div class="mitad-izq">
                <h2>STAY CONNECTED!</h2>
                <p>Help us spread the word! <strong>Follow us on Social Media</strong> and share our content with your network.</p>
                <ul class="redes-sociales">
                    <li><a href="#"><i class="fi fi-brands-facebook"></i></a></li>
                    <li><a href="#"><i class="fi fi-brands-instagram"></i></a></li>
                    <li><a href="#"><i class="fi fi-brands-tik-tok"></i></a></li>
                    <li><u>@terra_green</u></li>
                </ul>
            </div>
            <div class="mitad-der">
                <h2 class="titulo-logo">TERRA GREEN <i class="fa-solid fa-leaf"></i></h2>
                <table class="tabla-datos">
                    <tr><td>123 Terra Avenue, Terra City</td></tr>
                    <tr><td>NY 55555</td></tr>
                    <tr><td>(555) 456-7788</td></tr>
                    <tr><td><a href="mailto:info@terragreen.com"><em>info@terragreen.com</em></a></td></tr>
                    <tr><td><a href="https://uai.edu.ar" target="_blank">www.uai.edu.ar</a></td></tr>
                </table>
            </div>
        </footer>

    </div>

    <!-- Modal para Errores o Éxito -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close">&times;</span>
                <h2 class="modal-title" id="modalTitle">Resultado</h2>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
